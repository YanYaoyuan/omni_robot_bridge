name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-tooling:
    name: Release and deployment tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Shellcheck
        run: |
          shellcheck --severity=error \
            scripts/build.sh scripts/build-package.sh \
            scripts/deploy-prebuilt.sh scripts/deploy-core.sh scripts/ota.sh \
            test/test_ab_layout.sh test/test_ota_e2e.sh
      - name: Python contract tests
        run: python3 -m unittest discover -s test -p 'test_*.py' -v
      - name: A/B layout tests
        run: bash test/test_ab_layout.sh
      - name: OTA end-to-end tests
        run: bash test/test_ota_e2e.sh

  ros-core:
    name: ROS 2 Humble core build and test
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    defaults:
      run:
        shell: bash
    env:
      ROS_WS: ${{ github.workspace }}/ws
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v7.0.1
        with:
          path: ws/src/omni_robot_bridge
      - name: Checkout TF manager and SLAM status contract
        uses: actions/checkout@v7.0.1
        with:
          repository: YanYaoyuan/omni_tf_manager
          ref: main
          fetch-depth: 1
          path: ws/src/omni_tf_manager
      - name: Install CI prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake libeigen3-dev openssh-client \
            python3-colcon-common-extensions
      - name: Checkout shared Omni interfaces
        uses: actions/checkout@v7.0.1
        with:
          repository: YanYaoyuan/omni_robot_interfaces
          ref: main
          fetch-depth: 1
          path: ws/src/omni_robot_interfaces
          ssh-key: ${{ secrets.OMNI_INTERFACES_DEPLOY_KEY }}
      - name: Build core without vendor SDKs
        run: |
          source /opt/ros/humble/setup.bash
          cd "${ROS_WS}"
          colcon build \
            --packages-select omni_robot_interfaces omni_tf_manager rosdeck_robot_bridge \
            --cmake-args -DCMAKE_BUILD_TYPE=Release \
              -DROSDECK_BUILD_VBOT_ADAPTER=OFF \
              -DROSDECK_BUILD_ZSIBOT_ADAPTER=OFF \
            --event-handlers console_direct+
      - name: Test
        run: |
          source /opt/ros/humble/setup.bash
          cd "${ROS_WS}"
          colcon test --packages-select rosdeck_robot_bridge \
            --event-handlers console_direct+
          colcon test-result --verbose
      - name: Upload colcon logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bridge-colcon-${{ github.run_id }}
          path: ${{ env.ROS_WS }}/log
          retention-days: 3

  ros-core-sanitizers:
    name: ROS 2 Humble ASan and UBSan
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    defaults:
      run:
        shell: bash
    env:
      ROS_WS: ${{ github.workspace }}/ws
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v7.0.1
        with:
          path: ws/src/omni_robot_bridge
      - name: Checkout TF manager and SLAM status contract
        uses: actions/checkout@v7.0.1
        with:
          repository: YanYaoyuan/omni_tf_manager
          ref: main
          fetch-depth: 1
          path: ws/src/omni_tf_manager
      - name: Install CI prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake libasan5 libubsan1 libeigen3-dev \
            openssh-client python3-colcon-common-extensions
      - name: Checkout shared Omni interfaces
        uses: actions/checkout@v7.0.1
        with:
          repository: YanYaoyuan/omni_robot_interfaces
          ref: main
          fetch-depth: 1
          path: ws/src/omni_robot_interfaces
          ssh-key: ${{ secrets.OMNI_INTERFACES_DEPLOY_KEY }}
      - name: Build with sanitizers
        run: |
          source /opt/ros/humble/setup.bash
          cd "${ROS_WS}"
          colcon build \
            --packages-select omni_robot_interfaces omni_tf_manager rosdeck_robot_bridge \
            --cmake-args -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
              -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
              -DROSDECK_BUILD_VBOT_ADAPTER=OFF \
              -DROSDECK_BUILD_ZSIBOT_ADAPTER=OFF \
            --event-handlers console_direct+
      - name: Test with sanitizers
        run: |
          source /opt/ros/humble/setup.bash
          cd "${ROS_WS}"
          colcon test --packages-select rosdeck_robot_bridge \
            --event-handlers console_direct+
          colcon test-result --verbose
